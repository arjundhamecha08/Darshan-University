<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — MovieNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/custom.css">
    
</head>
<body class="dark-mode auth-page">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section id="login-container" class="card auth-card border-0 shadow-lg w-100">
            <div class="card-body p-4 p-md-5">
                <a href="index.html" class="d-inline-flex align-items-center mb-4"><img src="assets/logo.png" alt="MovieNest" class="auth-logo"></a>
                <h1 class="h3 fw-bold">Welcome Back</h1>
                <p class="text-body-secondary mb-4">Login to continue your MovieNest journey.</p>
                <form id="login-form">
                    <div class="mb-3"><label for="login-email" class="form-label">Email or Username</label><input type="text" id="login-email" class="form-control" placeholder="Enter email or username" required><small id="login-error" class="error text-danger"></small></div>
                    <div class="mb-3"><label for="login-password" class="form-label">Password</label><input type="password" id="login-password" class="form-control" placeholder="Enter your password" required><small id="password-error" class="error text-danger"></small></div>
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><div class="form-check"><input type="checkbox" id="remember-me" class="form-check-input"><label for="remember-me" class="form-check-label">Remember me</label></div><a href="#" id="forgot-password" class="small">Forgot Password?</a></div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    <p class="text-center small text-body-secondary mt-4 mb-0">Don't have an account? <a href="registration.html">Create Account</a></p>
                </form>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="static/storage.js"></script>
    <script src="static/form.js"></script>
</body>
</html>
