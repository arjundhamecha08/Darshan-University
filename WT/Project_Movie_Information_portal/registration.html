<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account — MovieNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="static/custom.css">
    
</head>
<body class="dark-mode auth-page">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section id="register-container" class="card auth-card border-0 shadow-lg w-100">
            <div class="card-body p-4 p-md-5">
                <a href="index.html" class="d-inline-flex align-items-center mb-4"><img src="assets/logo.png" alt="MovieNest" class="auth-logo"></a>
                <h1 class="h3 fw-bold">Join MovieNest</h1>
                <p class="text-body-secondary mb-4">Create your account and start your movie journey.</p>
                <form id="register-form">
                    <div class="mb-3"><label for="name" class="form-label">Full Name</label><input type="text" id="name" class="form-control" placeholder="Enter your full name" required><small id="name-error" class="error text-danger"></small></div>
                    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" class="form-control" placeholder="Enter your email" required><small id="email-error" class="error text-danger"></small></div>
                    <div class="mb-3"><label for="username" class="form-label">Username</label><input type="text" id="username" class="form-control" placeholder="Create a username" required><small id="username-error" class="error text-danger"></small></div>
                    <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" placeholder="Create a password" required><small id="password-error" class="error text-danger"></small></div>
                    <div class="mb-3"><label for="confirm-password" class="form-label">Confirm Password</label><input type="password" id="confirm-password" class="form-control" placeholder="Confirm your password" required><small id="confirm-password-error" class="error text-danger"></small></div>
                    <div class="form-check mb-4"><input type="checkbox" id="terms" class="form-check-input"><label for="terms" class="form-check-label">I agree to the Terms &amp; Conditions</label></div>
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    <p class="text-center small text-body-secondary mt-4 mb-0">Already have an account? <a href="login.html">Login</a></p>
                </form>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="static/storage.js"></script>
    <script src="static/form.js"></script>
</body>
</html>
