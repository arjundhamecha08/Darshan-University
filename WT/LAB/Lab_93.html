<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab_93</title>
    <style>
        div{
            border-radius: 50%;
            height: 100px;
            width: 100px;
            position: absolute;
        }
        #red{
            background-color: red;
            left: 0px;
            bottom: 0px;
        }
        #blue{
             background-color: blue;
             right: 0px;
             top: 0px;
        }
        #green{
            background-color: green;
            
            right: 0px;
            bottom: 0px;
        }
        #yellow{
             background-color: yellow;
             left: 0px;
             top: 0px;
        }

    </style>
</head>
<body>
    <div id="yellow"></div>
    <div id="blue"></div>
    <div id="red"></div>
    <div id="green"></div>
</body>
</html>
