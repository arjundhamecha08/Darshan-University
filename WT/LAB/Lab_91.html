<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        #box{
            height: 100px;
            width: 100px;
            background-color: red;
            position: absolute;
            animation: move 4s 2s infinite ease-out;
            animation-timing-function: ease-in-out;
            animation-direction: reverse;
        }
        
        @keyframes move{
            0%{
                top: 0%;
                left: 0%;
                background-color: red;
            }
            25%{
                top: 0%;
                left: 50%;
                background-color: yellow;
            }
            50%{
                top: 50%;
                left: 50%;
                background-color: red;
            }
            75%{
                top: 50%;
                left: 0%;
                background-color: yellow;
            }
            100%{
                top: 0%;
                left: 0%;
                background-color: red;
            }
        }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>
