<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 13_1</title>
</head>
<body>
    <script>
        let num = prompt("Enter Number: ");
        let factors = "";
        for(let i=1;i<num;i++){
            if(num%i == 0){
                factors += i+",";
            }
        } 
        document.write(factors);
    </script>
</body>
</html>
