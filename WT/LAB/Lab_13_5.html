<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 13_5</title>
</head>
<body>
    <script>
        let num = prompt("Enter Number: ");
        if(!num || num<2){
            document.write("Invalid Input");
        }
        else{
            document.write(Math.pow(parseInt(num[0]),parseInt(num[1])));
        }
    </script>
</body>
</html>
