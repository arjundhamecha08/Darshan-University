<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lab 65</title>
</head>
<body>
    <fieldset>
        <legend>Feedback Form</legend>
        <form action="#">
            <table>
                <tr>
                    <td>Email id</td>
                    <td><input type="email" required></td>
                </tr>
                <tr>
                    <td>Phone no.</td>
                    <td><input type="tel" maxlength="10" min="600000000" max="999999999" required></td>
                </tr>
                <tr>
                    <td>Subject: </td>
                    <td><input type="text" maxlength="25" minlength="5" required></td>
                </tr>
                <tr>
                    <td>Feedback: </td>
                    <td><textarea minlength="50" maxlength="250" required></textarea></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <div id="btn"><input type="submit"></div></td>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
