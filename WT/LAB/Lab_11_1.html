<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 11.1</title>
    <style>
        #btn:hover{
            background-color: green;
            border-radius: 20px;
            border: 3px solid black;
        }
        input:focus{
            border: 3px solid red; 
            color: red;
            font-size: large;
        }
        li:nth-child(2){
            color: red;
        }

    </style>
</head>
<body>
    <button id="btn">Submit</button>
    <input type="text">
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
        <li>Dragon-Fruite</li>
    </ul>
</body>
</html>
