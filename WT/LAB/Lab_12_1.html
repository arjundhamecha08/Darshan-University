<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12_1</title>
</head>
<body>
    <script>
        let num1 = Number(prompt("Enter Number 1"));
        let num2 = Number(prompt("Enter Number 2"));
        let op = prompt("Enter Operation: ");
        switch(op){
            case '+':
                alert(num1+num2);
                break;
            case '-':
                alert(num1-num2);
                break;
            case '*':
                alert(num1*num2);
                break;
            case '/':
                alert(num1/num2);
                break;
            case '%':
                alert(num1%num2);
                break;
        }
    </script>
</body>
</html>
