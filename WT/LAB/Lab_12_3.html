<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 12_3</title>
</head>
<body>
    <script>
        let number = Number(prompt("Enter number: "));
        let fact = 1;
        for(let i=1;i<=number;i++){
            fact *= i;
        }
        alert("Factorial is: "+fact);
    </script>
</body>
</html>
